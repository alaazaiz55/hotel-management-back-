version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
          - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend

  spring-app:
    build: ./hotel_back
    container_name: spring-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/mydb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8090:8089"
    depends_on:
      - postgres
    networks:
      - backend

  angular-app:
    build: ./hotel_front
    container_name: angular-app
    ports:
      - "4400:80"
    depends_on:
      - spring-app
    networks:
      - backend

networks:
  backend:
